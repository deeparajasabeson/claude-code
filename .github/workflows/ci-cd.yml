name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/interview-prep-web/package-lock.json

      - name: Test React app
        working-directory: src/interview-prep-web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test API
        run: dotnet test --configuration Release

      - name: Publish (API + React build in wwwroot)
        run: dotnet publish src/InterviewPrep.Api --configuration Release --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC federated credential, no stored Azure secrets
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
